name: Sync & Deploy

on:
  schedule:
    # 每小时第 30 分钟运行一次（UTC），即北京时间每小时 30 分
    - cron: '30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 同步插件市场数据
        run: node scripts/sync.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交同步后的数据快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/plugins.json
          git diff --cached --quiet || git commit -m "chore: 每小时同步 dsh-plugin 插件数据 [skip ci]"
          git push

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true

      - name: 部署到腾讯云 COS（国内访问）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 coscmd
        run: pip install coscmd

      - name: 配置 coscmd
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
                        -s ${{ secrets.TENCENT_SECRET_KEY }} \
                        -b ${{ secrets.COS_BUCKET }} \
                        -r ${{ secrets.COS_REGION }}

      - name: 上传到 COS
        run: coscmd upload -rs ./web/ /
